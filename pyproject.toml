[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agent-memes"
version = "0.1.0"
description = "Agent-friendly meme video toolkit: search reaction clips, fetch them, and drop them into any editing workflow (ffmpeg, Premiere, Resolve, Final Cut, OTIO, Remotion, HyperFrames). CLI + MCP server, zero dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "agent-memes contributors" }]
keywords = ["memes", "video", "ai-agents", "mcp", "ffmpeg", "otio", "fcpxml", "video-editing", "reaction-clips"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/exdzy/agent-memes"
Issues = "https://github.com/exdzy/agent-memes/issues"

[project.scripts]
agent-memes = "agent_memes.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memes"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "AGENTS.md", "llms.txt", "skills", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM905", "SIM108"]
